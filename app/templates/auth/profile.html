{% extends "base.html" %}

{% block title %}My Profile{% endblock %}
{% block header_title %}User Profile & Settings{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-7">
    <div class="card-retail">
      <div class="card-retail-header">
        <h5>Account Details</h5>
        <span class="badge {% if user.role == 'ADMIN' %}badge-soft-terracotta{% else %}badge-soft-navy{% endif %}">
          {{ user.role }}
        </span>
      </div>
      <div class="card-retail-body">
        <form method="POST">
          <div class="mb-3">
            <label class="form-label">Username</label>
            <input type="text" class="form-control bg-light" value="{{ user.username }}" readonly disabled>
            <div class="form-text">Usernames cannot be changed.</div>
          </div>

          <div class="row">
            <div class="col-md-6 mb-3">
              <label for="full_name" class="form-label">Full Name</label>
              <input type="text" class="form-control" id="full_name" name="full_name"
                     value="{{ user.full_name }}" required>
            </div>
            <div class="col-md-6 mb-3">
              <label for="email" class="form-label">Email Address</label>
              <input type="email" class="form-control" id="email" name="email"
                     value="{{ user.email }}" required>
            </div>
          </div>

          <hr class="my-4">
          <h6 class="fw-bold mb-3" style="color: var(--sidebar-navy);">Change Password</h6>
          <p class="text-muted small">Leave blank if you do not want to update your password.</p>

          <div class="row">
            <div class="col-md-6 mb-3">
              <label for="new_password" class="form-label">New Password</label>
              <input type="password" class="form-control" id="new_password" name="new_password"
                     placeholder="Min. 6 characters">
            </div>
            <div class="col-md-6 mb-3">
              <label for="confirm_password" class="form-label">Confirm New Password</label>
              <input type="password" class="form-control" id="confirm_password" name="confirm_password"
                     placeholder="Re-type new password">
            </div>
          </div>

          <div class="d-flex justify-content-end gap-2 mt-4">
            <button type="submit" class="btn btn-terracotta">
              <i class="bi bi-save me-1"></i> Save Profile Changes
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
